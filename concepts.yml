context: social-media
name: Social Media
intro: >-
  The common social-media vocabulary -- the social accounts and profiles that publish, the
  posts they publish and schedule, the comments on those posts and the analytics that measure
  them -- distilled from the APIs that already exist.
tags: [Social Media, Social, Social Media Management, Social Networking, Creator Economy, Influencer Marketing, Social Listening]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url, includes]

common_fields:
  id: [uuid, guid, object_id, record_id, external_id, post_id, profile_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on, published_at, created_time, timestamp, posted_at]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties]
  status: [state, post_status, publish_status]
  name: [title, display_name, label, full_name]
  platform: [network, network_type, service, channel, provider, source, social_network, type]

concepts:
  social_account:
    path: /social-accounts
    segments: [profiles, profile, social_accounts, social-accounts, socialaccounts, accounts@social|channels|networks, channels@social|publishing, social_profiles, creators, influencers]
    aliases:
      username: [handle, screen_name, user_name, login]
      avatar_url: [profile_image_url, picture, image, avatar, profile_picture_url]
      follower_count: [followers, followers_count, follower_count_total, fans]
      following_count: [following, friends_count, follows_count]
      bio: [description, biography, about]
      verified: [is_verified, verification]
  post:
    segments: [posts, post, tweets, tweet, updates@social|profiles, media@instagram|social, publications, scheduled_posts, statuses, shares@linkedin|ugc]
    aliases:
      text: [content, message, body, caption, text_content, commentary]
      media_urls: [media, attachments, images, media_url, image_urls, assets]
      author_id: [author, profile_id, account_id, user_id, owner, from]
      scheduled_at: [schedule_time, scheduled_time, scheduled_for, publish_at, due_at]
      permalink: [url, link, post_url, permalink_url]
      like_count: [likes, likes_count, favorite_count, reactions]
      comment_count: [comments_count, comments, reply_count, replies]
      share_count: [shares, retweet_count, reposts, shares_count]
  social_comment:
    requires: [post]
    path: /posts/{post_id}/comments
    segments: ["comments@posts|post|media|videos|tweets", "replies@posts|post|comments|tweets", "comments"]
    aliases:
      text: [message, body, content]
      author_id: [author, from, user, username]
      like_count: [likes, like_count_total]
  # post_analytics was measured and dropped: 6 providers, whose only shared fields were one
  # vendor's metric keys.

exclude:
  post:
    beehiiv: /publications are newsletters
    later: /action-groups/statuses are job statuses
duplicates:
  khoros-ai: [lithium, spredfast]
  later: [mavrck]
  opusclip: [opus]
  impact: [impact-radius]

findings:
  - "A post agrees on id, text and created_at -- across networks (X, LinkedIn, ActivityPub
    servers such as Pixelfed) and the publishing tools that schedule onto them."
  - "A comment agrees on id, author, text and created_at -- the same core as a post, one level
    down."
  - "A social account agrees on nothing outright: networks expose a user, publishing tools a
    connected channel, and creator platforms an influencer profile."
decisions:
  - "A social account is `/social-accounts`; profiles, connected channels, creators and
    influencers all count."
  - "Tweets, statuses and publications beneath a social path are posts; newsletters are not."
  - "Post analytics were measured and dropped: too few providers, no shared metric names."
  - "Duplicates merged: Lithium and Spredfast into Khoros, Mavrck into Later, Opus into OpusClip,
    Impact."
